name: khmer_dubber_mobile
description: "CineDub AI - Khmer Video Dubber Studio mobile app based on Obsidian Cinema AI design system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  edge_tts: ^0.1.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
