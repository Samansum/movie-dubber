name: khmer_dubber_mobile
description: "CineDub AI - Khmer Video Dubber Studio mobile app based on Obsidian Cinema AI design system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.3
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  edge_tts: ^0.1.0
  video_player: ^2.11.1
  ffmpeg_kit_flutter_new: ^4.6.4
  google_generative_ai: ^0.4.7
  flutter_secure_storage: ^10.3.4
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"   # match your icon's edge color
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 0     # no extra padding

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  # Enables `flutter gen-l10n` so AppLocalizations is generated from the ARB
  # files in lib/l10n/ during `flutter run` / `flutter test`.
  generate: true
  assets:
    - assets/images/
